<!DOCTYPE html>

                        "secondary-fixed": "#ffdbca",

                    "spacing": {

                        "gutter": "20px",
                        "base": "4px",
                        "md": "16px",
                        "xl": "32px",
                        "lg": "24px",
                        "margin-desktop": "40px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],

<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex font-body-md text-body-md">
<!-- Left Side: Graphic & Quote (Hidden on mobile) -->
<div class="hidden lg:flex lg:w-1/2 relative bg-surface-container-high flex-col justify-end overflow-hidden">
<div class="absolute inset-0 z-0" data-alt="A highly detailed, cinematic wide shot of a modern, automated logistics warehouse at dusk. Racks stretch into the distance. Bright, clean lighting highlights autonomous robots moving packages. The overall aesthetic is professional, data-driven, and efficient, utilizing a cool corporate color palette with subtle cobalt blue accents. The mood is dynamic and progressive." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCxdJd1nb7sAndSVoJ765uscEBJtwTIdjDrH3NIFF8W4CKcxLdAyU9xHE-E46Oa7jEZFgfUzDH67B7VDS391NfYANLq07AwdgyeZEt_JB2ItxMK8MllVDOP9IKNLO6LmVi4MP7oFtZhCZ1ABu2UsD7fjIfessyx3ecMHFjz_uKPf9nhjNN0Whxryd8BmFXFe7YSIQ_3KKx2L18fkFH9P0W9-K9tBg1tqZ1fFR33Cyroyckr6Iv8h1cb')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-primary/90 to-primary/20 z-10"></div>
<div class="relative z-20 p-margin-desktop mb-margin-desktop text-on-primary">
<span class="material-symbols-outlined text-4xl mb-lg" data-icon="local_shipping">local_shipping</span>
<h1 class="font-display text-display mb-sm">SwiftLogix</h1>
<p class="font-headline-md text-headline-md opacity-90 max-w-lg">
                "Innovación que mueve el mundo."
            </p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface-container-lowest relative">
<div class="w-full max-w-md">
<!-- Mobile Logo -->
<div class="flex items-center gap-2 mb-xl lg:hidden">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="local_shipping">local_shipping</span>
<span class="font-headline-sm text-headline-sm font-bold text-primary">SwiftLogix</span>
</div>
<div class="mb-lg">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg mb-xs">Bienvenido de nuevo</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Ingresa tus credenciales para acceder a tu panel.</p>
</div>
<form class="space-y-lg">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Correo Electrónico</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:border-primary sm:text-sm transition-colors" id="email" name="email" placeholder="ejemplo@empresa.com" type="email"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex items-center justify-between">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Contraseña</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">¿Olvidé mi contraseña?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2 border border-outline-variant rounded bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:border-primary sm:text-sm transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer">
<span class="material-symbols-outlined text-outline-variant hover:text-on-surface-variant transition-colors" data-icon="visibility">visibility</span>
</div>
</div>
</div>
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                        Recordarme
                    </label>
</div>
<div>
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-95" type="submit">
                        Entrar
                    </button>
</div>
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        ¿No tienes una cuenta? <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Solicitar acceso</a>
</p>
</div>
</form>
</div>
</div>
</body></html>
